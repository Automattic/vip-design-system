<!--
	Aktiv Grotesk (Adobe Fonts). Storybook injects this file into the preview
	iframe's <head>. It is deliberately NOT loaded from src/css: the package
	names aktiv-grotesk in --font-family-default, but must never fetch the
	licensed font itself. An @import in src/css would compile into the
	published dist/css/index.css and impose Adobe's kit on every consumer.
	Loading the font is the consuming app's job. .storybook/ is not published
	(package.json restricts the tarball to "files": ["dist"]).
-->
<link rel="stylesheet" href="https://use.typekit.net/yym8qzc.css" />
